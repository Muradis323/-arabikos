<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#5a3f2b" />
  <meta name="description" content="Арабикос — тренер арабского языка Корана: слова, глаголы, предлоги, предложения, правила и короткие рассказы." />
  <title>Арабикос — тренер арабского языка Корана</title>

<body>
  <div class="paper-noise" aria-hidden="true"></div>

        <h1>Арабикос</h1>

    <div class="progress-box">
      <div class="progress-row"><span>Прогресс</span><strong id="progressText">0%</strong></div>

  <main class="book-shell">

      <button class="nav-btn" data-section="stories"><span>ح</span> Рассказы</button>
    </aside>

    <section class="page" id="app" aria-live="polite"></section>
  </main>

  <footer>
    <span>Арабикос · учебный тренажёр</span>
    <button id="resetBtn" class="link-btn">Сбросить прогресс</button>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
